name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Definir versao a partir da tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || V="$(node -p "require('./manifest.json').version")"
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Versao: $V"

      - name: Gravar versao nos dois manifests
        run: |
          for f in manifest.json manifest.firefox.json; do
            node -e "
              const fs=require('fs');
              const m=JSON.parse(fs.readFileSync('$f','utf8'));
              m.version='${{ steps.ver.outputs.v }}';
              fs.writeFileSync('$f', JSON.stringify(m,null,2)+'\n');
            "
          done

      - name: Montar pacote do Chrome
        run: |
          mkdir -p dist/chrome
          cp -r icons background.js content.js dist/chrome/
          cp manifest.json dist/chrome/manifest.json
          (cd dist/chrome && zip -qr ../revisor-visual-chrome-${{ steps.ver.outputs.v }}.zip .)

      - name: Montar pasta do Firefox
        run: |
          mkdir -p dist/firefox
          cp -r icons background.js content.js dist/firefox/
          cp manifest.firefox.json dist/firefox/manifest.json

      - name: Assinar o .xpi no AMO (unlisted)
        id: sign
        if: github.ref_type == 'tag'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "::warning::Sem credenciais do AMO. Pulando a assinatura, o .xpi nao sai."
            exit 0
          fi
          set -o pipefail
          npx --yes web-ext@latest sign \
            --source-dir dist/firefox \
            --artifacts-dir dist \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Conferir o que saiu
        run: ls -lh dist/*.zip dist/*.xpi 2>/dev/null || ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: |
            dist/*.zip
            dist/*.xpi

      - name: Montar a nota do Release
        env:
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          python3 - <<'PY'
          import os, glob, pathlib
          ver = "${{ steps.ver.outputs.v }}"
          xpi = sorted(glob.glob("dist/*.xpi"))
          xpi = os.path.basename(xpi[0]) if xpi else "(nao gerado nesta versao)"
          eid = os.environ.get("CWS_EXTENSION_ID", "").strip()
          cws = "https://chromewebstore.google.com/detail/%s" % eid if eid else ""
          src = ".github/release-chrome-loja.md" if cws else ".github/release-chrome-manual.md"
          chrome = pathlib.Path(src).read_text(encoding="utf-8").replace("__CWS_URL__", cws)
          notes = pathlib.Path(".github/release-notes.md").read_text(encoding="utf-8")
          notes = notes.replace("__CHROME__", chrome).replace("__XPI__", xpi).replace("__VERSION__", ver)
          pathlib.Path("notes.md").write_text(notes, encoding="utf-8")
          print(notes)
          PY

      - name: Publicar no Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Revisor Visual ${{ steps.ver.outputs.v }}" \
            --notes-file notes.md \
            dist/*.zip $(ls dist/*.xpi 2>/dev/null)

      - name: Publicar na Chrome Web Store
        if: github.ref_type == 'tag'
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$EXTENSION_ID" ]; then
            echo "::warning::Sem credenciais da Chrome Web Store. O zip fica so no Release."
            exit 0
          fi
          npx --yes chrome-webstore-upload-cli@latest \
            --source "dist/revisor-visual-chrome-${{ steps.ver.outputs.v }}.zip" \
            --extension-id "$EXTENSION_ID"
